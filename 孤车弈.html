<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>孤车弈</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1e2f; font-family: 'Segoe UI', 'Noto Sans SC', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .game-container { display: flex; gap: 24px; background: #2a2a3c; padding: 20px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); align-items: flex-start; position: relative; }
    .board-section { flex-shrink: 0; position: relative; }
    .board-canvas { display: block; border: 2px solid #5a3e2b; border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 8px 20px rgba(0,0,0,0.5); background: #d4a574; cursor: pointer; }
    .pieces-layer { position: absolute; top: 2px; left: 2px; width: calc(100% - 4px); height: calc(100% - 4px); pointer-events: none; }
    .piece { width: 46px; height: 46px; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); z-index: 5; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); pointer-events: none; user-select: none; line-height: 1; }
    .piece.red { background: radial-gradient(circle at 35% 30%, #e05a4f, #9e2a23); border: 3px solid #6b1d18; box-shadow: 0 4px 10px rgba(180,30,20,0.6); }
    .piece.red.protected { animation: protectGlow 0.6s infinite alternate; border-color: #f0c040; }
    @keyframes protectGlow { 0% { box-shadow: 0 0 8px rgba(240,192,64,0.6), 0 4px 10px rgba(180,30,20,0.6); } 100% { box-shadow: 0 0 25px rgba(240,192,64,1), 0 0 40px rgba(240,192,64,0.7), 0 4px 10px rgba(180,30,20,0.6); } }
    .piece.black { background: radial-gradient(circle at 35% 30%, #5a5a6a, #2a2a3a); border: 3px solid #1a1a2a; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
.piece.black.general { background: radial-gradient(circle at 35% 30%, #2a2a3a, #151525); border: 4px solid #d4a020; box-shadow: 0 0 15px rgba(212,160,32,0.6), 0 4px 12px rgba(0,0,0,0.6), inset 0 0 12px rgba(212,160,32,0.15); animation: generalGlow 1.5s infinite alternate; color: #f4d030; font-size: 24px; font-weight: 900; }
@keyframes generalGlow { 0% { box-shadow: 0 0 12px rgba(212,160,32,0.5), 0 4px 12px rgba(0,0,0,0.6), inset 0 0 10px rgba(212,160,32,0.1); } 100% { box-shadow: 0 0 25px rgba(212,160,32,0.9), 0 0 40px rgba(212,160,32,0.5), 0 4px 12px rgba(0,0,0,0.6), inset 0 0 15px rgba(212,160,32,0.2); } }
.piece.stone { background: radial-gradient(circle at 35% 30%, #8b7a5e, #5a4a3a); border: 3px solid #3a2a1a; color: #e8d8c8; box-shadow: 0 3px 8px rgba(0,0,0,0.5); font-size: 18px; border-radius: 20%; }
    .order-badge { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #1a1a1a; border: 2px solid #f0c040; color: #f0c040; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 10; pointer-events: none; box-shadow: 0 0 12px rgba(240,192,64,0.6); text-shadow: 0 0 6px black; transform: translate(50%, -50%); }
    .highlight-dot { position: absolute; width: 36px; height: 36px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 2; }
    .highlight-dot.move { background: rgba(0, 150, 255, 0.45); box-shadow: 0 0 16px rgba(0,150,255,0.6); }
    .highlight-dot.ability { background: rgba(255, 180, 0, 0.5); box-shadow: 0 0 18px rgba(255,180,0,0.7); }
    .highlight-dot.capture { background: rgba(255, 60, 40, 0.55); box-shadow: 0 0 20px rgba(255,60,40,0.8); }
    .rook-targeted { position: absolute; width: 54px; height: 54px; border-radius: 50%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; border: 3px solid rgba(255, 60, 30, 0.9); box-shadow: 0 0 20px rgba(255, 40, 20, 0.8), 0 0 40px rgba(255, 80, 40, 0.5), inset 0 0 15px rgba(255, 50, 30, 0.4); animation: targetPulse 0.8s infinite alternate; }
    @keyframes targetPulse { 0% { box-shadow: 0 0 15px rgba(255, 40, 20, 0.7), 0 0 30px rgba(255, 80, 40, 0.4), inset 0 0 10px rgba(255, 50, 30, 0.3); } 100% { box-shadow: 0 0 25px rgba(255, 30, 15, 1), 0 0 50px rgba(255, 60, 30, 0.7), inset 0 0 20px rgba(255, 40, 20, 0.6); } }
    .danger-cross { position: absolute; width: 30px; height: 30px; transform: translate(-50%, -50%); pointer-events: none; z-index: 1; }
    .danger-cross::before, .danger-cross::after { content: ''; position: absolute; background: rgba(0,0,0,0.55); border-radius: 2px; }
    .danger-cross::before { width: 100%; height: 4px; top: 50%; left: 0; transform: translateY(-50%); }
    .danger-cross::after { width: 4px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
    .danger-cross .red-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .danger-cross .red-overlay::before, .danger-cross .red-overlay::after { content: ''; position: absolute; background: rgba(200, 30, 20, 0.7); border-radius: 1px; }
    .danger-cross .red-overlay::before { width: 60%; height: 2px; top: 50%; left: 20%; transform: translateY(-50%); }
    .danger-cross .red-overlay::after { width: 2px; height: 60%; left: 50%; top: 20%; transform: translateX(-50%); }
    .cannon-laser { position: absolute; z-index: 3; pointer-events: none; background: rgba(255,40,40,0.7); box-shadow: 0 0 6px rgba(255,40,40,0.8); }
    .cannon-laser.horizontal { height: 2px; }
    .cannon-laser.vertical { width: 2px; }

    .victory-overlay, .defeat-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: none; gap: 8px; }
    .victory-text { font-size: 42px; font-weight: bold; color: #f0c040; text-shadow: 0 0 20px rgba(240,192,64,0.8), 0 0 40px rgba(240,192,64,0.5); }
    .victory-sub { font-size: 18px; color: #f0c040; text-shadow: 0 0 10px rgba(240,192,64,0.5); }
    .defeat-text { font-size: 42px; font-weight: bold; color: #e04040; text-shadow: 0 0 20px rgba(224,64,64,0.8), 0 0 40px rgba(224,64,64,0.5); }
    .side-panel { background: #2f2f44; border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 220px; color: #e8e0d0; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    .panel-title { font-size: 22px; font-weight: bold; color: #f0c040; text-align: center; }
    .level-box { background: #1a1a2e; border-radius: 12px; padding: 8px 12px; text-align: center; font-size: 18px; color: #f0c040; }
    .score-box { background: #1a1a2e; border-radius: 12px; padding: 8px 14px; text-align: center; font-size: 15px; color: #aaa; }
    .score-box span { color: #f0c040; font-weight: bold; font-size: 20px; }
    .ability-btn { padding: 10px 8px; font-size: 15px; font-weight: bold; border-radius: 12px; border: 2px solid #5a5a7a; background: #3a3a52; color: #d0d0e0; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .ability-btn.active { border-color: #f0c040; background: #4a4020; color: #f0c040; box-shadow: 0 0 18px #f0c04080; }
    .ability-btn .badge { background: #f0c040; color: #1a1a1a; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
    .recall-btn { padding: 10px 8px; font-size: 15px; font-weight: bold; border-radius: 12px; border: 2px solid #4a90d9; background: #1e3050; color: #80c0ff; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .recall-btn:hover { background: #2a4070; color: #a0d0ff; }
    .recall-btn.recalling { border-color: #f0c040; background: #4a4020; color: #f0c040; box-shadow: 0 0 18px #f0c04080; animation: btnGlow 0.8s infinite alternate; }
    @keyframes btnGlow { 0% { box-shadow: 0 0 15px rgba(240,192,64,0.5), 0 0 30px rgba(240,192,64,0.2); } 100% { box-shadow: 0 0 30px rgba(240,192,64,0.9), 0 0 60px rgba(240,192,64,0.5); } }
    .restart-btn { padding: 10px; font-weight: bold; font-size: 15px; border-radius: 12px; border: 2px solid #c0392b; background: #4a2020; color: #e0a0a0; cursor: pointer; margin-top: auto; transition: all 0.3s; }
    .restart-btn:hover { background: #622a2a; color: #ffcccc; }
    .restart-btn.glowing { border-color: #f0c040; background: #5a3020; color: #f0c040; box-shadow: 0 0 20px rgba(240,192,64,0.6), 0 0 40px rgba(240,192,64,0.3); animation: btnGlow 0.8s infinite alternate; }
    .ai-btn { padding: 10px 8px; font-size: 15px; font-weight: bold; border-radius: 12px; border: 2px solid #3fae7a; background: #14352a; color: #8fe8b8; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .ai-btn:hover { background: #1d4a38; color: #b8f8d0; }
    .ai-btn.busy { opacity: 0.6; cursor: wait; }
    .info-text { font-size: 12px; color: #999; text-align: center; }
    .danger-warning { color: #e08070; font-size: 12px; text-align: center; margin-top: 4px; animation: pulse 1.5s infinite; }
    .protection-info { color: #c0a060; font-size: 12px; text-align: center; margin-top: 4px; line-height: 1.4; }
    @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    .board-footer-text { margin-top: 6px; font-size: 11px; color: #b0a080; text-align: center; line-height: 1.5; white-space: nowrap; }
  </style>
</head>
<body>
<div class="game-container">
  <div class="board-section">
    <canvas id="boardCanvas" class="board-canvas" width="540" height="600"></canvas>
    <div class="pieces-layer" id="piecesLayer"></div>
    <div id="victoryOverlay" class="victory-overlay" style="display:none;"><div class="victory-text">胜利！</div><div class="victory-sub">点击棋盘继续下一关</div></div>
    <div id="defeatOverlay" class="defeat-overlay" style="display:none;"><div class="defeat-text">红车阵亡！</div></div>
    <div class="board-footer-text">
      <div>山: <span id="stoneCountDisplay">?</span>个 | 能力：A马 S炮 D象 F士 | 敌增援:每回合开始(被吃子则2个，否则1个)</div>
      <div>击杀黑将过关 | 黑子上限<span id="maxBlackDisplay">16</span> | 山可蹩马脚、塞象眼、作炮架</div>
      <div>敌子能走时必走 | 敌炮的威胁范围请自行判断</div>
    </div>
  </div>
  <div class="side-panel">
    <div class="panel-title">孤车弈</div>
    <div class="level-box" id="levelDisplay">第 1 关</div>
    <div class="score-box">🏆 最高关: <span id="highScoreDisplay">0</span></div>
    <button class="ability-btn" id="btnHorse">🐴 马 <span class="badge" id="badgeHorse">1</span></button>
    <button class="ability-btn" id="btnCannon">💣 炮 <span class="badge" id="badgeCannon">1</span></button>
    <button class="ability-btn" id="btnElephant">🐘 象 <span class="badge" id="badgeElephant">1</span></button>
    <button class="ability-btn" id="btnAdvisor">👤 士 <span class="badge" id="badgeAdvisor">1</span></button>
    <button class="recall-btn" id="btnRecall">🏰 回城</button>
    <button class="ai-btn" id="btnAiFull">✨ 帮我走</button>
    <button class="ai-btn" id="btnCopyState">📋 复制局面</button>
    <button class="ai-btn" id="btnUndo">↩️ 悔棋</button>
    <div class="info-text"><strong>A/S/D/F</strong> 激活 · <strong>Z</strong> 取消能力 · <strong>R</strong> 回城（不可取消）</div>
    <div class="protection-info" id="protectionInfo">🛡盾击:能力总和≥5时被吃反杀</div>
    <div class="danger-warning">⚠敌人的威胁范围可能随行棋而改变</div>
    <button class="restart-btn" id="btnRestart">🔄 重新开始</button>
  </div>
</div>

<script>
(function() {
  const ROWS = 10, COLS = 9, CELL = 60;
  const T = { R:'red_rook',BR:'black_rook',BN:'black_knight',BC:'black_cannon',BE:'black_elephant',BA:'black_advisor',BG:'black_general',S:'stone' };
  const AB = [T.BR,T.BN,T.BC,T.BE,T.BA,T.BG];
  const LIMITS = { [T.BG]:1,[T.BA]:2,[T.BE]:2 };
  const BLACK_SIDE = 5;
  const SPAWN_POINT = {row:9, col:4};

  function getMaxBlack(){return Math.min(16+LV-1,45)}
  function getInitialBlack(){return Math.min(5+LV-1,16)}

  const cv=document.getElementById('boardCanvas'),ctx=cv.getContext('2d');
  const pl=document.getElementById('piecesLayer'),vo=document.getElementById('victoryOverlay');
  const df=document.getElementById('defeatOverlay'),br=document.getElementById('btnRestart');
  const btnRecall=document.getElementById('btnRecall');

  let B,PD,RP,BP,RS,AA=null,HC=[],GO=false,PT=true,BO=[],CID=0,LV=1,HS=0;
  let ATE=false,SC=6,DC=[],RT=false,cRM=null,cAM={},cAS=new Set(),cDL=new Set();
  let dTO=null,SWC=0,VA=false,RECALLING=false;
  let solving=false,SOLVE_VER=0;
  let LAST_RED=null;
  let lossSteps=0;
  let shieldBurns=0;
  let lastKillUsed=false;
  let REC_LOG=null,REC_ACTIVE=false;
  let UNDO_STACK=[];
  // 搜索内部用的伪随机数：按局面哈希做种子，同一局面结果固定；
  // 真实游戏的黑方增援/顺序仍用 Math.random（真随机）
  let RNG=Math.random;
  function makeRNG(seed){
    let a=seed>>>0;
    return function(){
      a|=0;a=a+0x6D2B79F5|0;
      let t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  function posHash(){
    let h=2166136261;
    const mix=(x)=>{h^=x;h=Math.imul(h,16777619)>>>0};
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=B[r][c];mix(t?t.charCodeAt(0):0);mix(r*9+c)}
    for(const b of BP){mix(b.type.charCodeAt(0));mix(b.row*9+b.col);mix(b.order)}
    mix(RP?RP.row*9+RP.col:0);
    for(const k in RS)mix(RS[k]);
    mix(LV);mix(ATE?1:0);mix(SWC);mix(LAST_RED?LAST_RED.fr*9+LAST_RED.fc:0);
    return h;
  }

  function lh(){try{HS=parseInt(localStorage.getItem('cr_hs'))||0}catch(e){HS=0};document.getElementById('highScoreDisplay').textContent=HS}
  function sh(){if(LV>HS){HS=LV;localStorage.setItem('cr_hs',HS)};document.getElementById('highScoreDisplay').textContent=HS}
  function cd(sl){SOLVE_VER++;LAST_RED=null;REC_LOG=null;REC_ACTIVE=false;UNDO_STACK=[];B=Array.from({length:ROWS},()=>Array(COLS).fill(null));PD={};BP=[];RP={row:9,col:4};RS={horse:1,cannon:1,elephant:1,advisor:1};AA=null;HC=[];GO=false;PT=true;BO=[];CID=0;ATE=false;DC=[];RT=false;cRM=null;cAM={};cAS=new Set();cDL=new Set();LV=sl||1;SWC=0;VA=false;RECALLING=false;btnRecall.classList.remove('recalling')}
  function ta(){return RS.horse+RS.cannon+RS.elephant+RS.advisor}
  function ip(){return ta()>=5}
  function rar(n){const k=['horse','cannon','elephant','advisor'];let r=n;while(r>0&&ta()>0){const x=k[Math.floor(RNG()*4)];if(RS[x]>0){const d=Math.min(RS[x],r);RS[x]-=d;r-=d}}}
  function pp(r,c,t){B[r][c]=t;const id=CID++;PD[`${r},${c}`]={type:t,id,row:r,col:c};if(t===T.R)RP={row:r,col:c};else if(AB.includes(t))BP.push({row:r,col:c,type:t,id,order:-1,hasMoved:false})}
  function rp2(r,c){const k=`${r},${c}`,info=PD[k];if(!info)return;B[r][c]=null;delete PD[k];if(info.type===T.R)RP=null;else if(AB.includes(info.type))BP=BP.filter(b=>b.id!==info.id)}
  function mp(fr,fc,tr,tc){const info=PD[`${fr},${fc}`];if(!info)return null;const ct=B[tr][tc];if(ct)rp2(tr,tc);B[fr][fc]=null;delete PD[`${fr},${fc}`];B[tr][tc]=info.type;PD[`${tr},${tc}`]={type:info.type,id:info.id,row:tr,col:tc};if(info.type===T.R)RP={row:tr,col:tc};else if(AB.includes(info.type)){const bp=BP.find(b=>b.id===info.id);if(bp){bp.row=tr;bp.col=tc}}cRM=null;cAM={};uac();return{movedType:info.type,capturedType:ct}}
  function ge(){const e=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!B[r][c])e.push({row:r,col:c});return e}
  function bc(){return BP.length}
  function shf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
  function rdl(rr,rc){const l=new Set();for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){let nr=rr+dr,nc=rc+dc;while(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){l.add(`${nr},${nc}`);if(B[nr][nc]!==null)break;nr+=dr;nc+=dc}}return l}
  function aac(rr,rc,res){if(rr==null)return new Set();const atk=new Set();for(const m of rm(rr,rc,true))atk.add(`${m.row},${m.col}`);if(res.horse>0)for(const m of knm(rr,rc,true))atk.add(`${m.row},${m.col}`);if(res.cannon>0)for(const m of cnm(rr,rc,true))atk.add(`${m.row},${m.col}`);if(res.elephant>0)for(const m of elm(rr,rc,true))atk.add(`${m.row},${m.col}`);if(res.advisor>0)for(const m of adm(rr,rc,true))atk.add(`${m.row},${m.col}`);return atk}
  function uac(){if(RP){cAS=aac(RP.row,RP.col,RS);cDL=rdl(RP.row,RP.col)}else{cAS=new Set();cDL=new Set()}}
  function dtr(r,c){return RP?Math.max(Math.abs(r-RP.row),Math.abs(c-RP.col)):0}
  function bse(){const e=[];for(let r=BLACK_SIDE;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!B[r][c])e.push({row:r,col:c});return e}
  function csg(){return SWC>=LV}
  function rbt(eg){const cnt={};for(const b of BP)cnt[b.type]=(cnt[b.type]||0)+1;const av=AB.filter(t=>{if(eg&&t===T.BG)return false;if(LIMITS[t]!==undefined)return(cnt[t]||0)<LIMITS[t];return true});return av.length?av[Math.floor(Math.random()*av.length)]:null}
  function psc(fg){const bs=bse(),ae=ge();const ffr=(cells)=>cells.filter(c=>!RP||(dtr(c.row,c.col)>3&&!cDL.has(`${c.row},${c.col}`)));if(fg){let cand=bs.length>0?bs:ae;cand=ffr(cand);if(cand.length===0)cand=bs.length>0?bs:ae;const sf=cand.filter(c=>!cDL.has(`${c.row},${c.col}`)&&!cAS.has(`${c.row},${c.col}`));if(sf.length>0){sf.sort((a,b)=>dtr(b.row,b.col)-dtr(a.row,a.col));return sf[0]}const sf2=cand.filter(c=>!cDL.has(`${c.row},${c.col}`));if(sf2.length>0)return sf2[Math.floor(Math.random()*sf2.length)];return cand[Math.floor(Math.random()*cand.length)]}let pool=ae;const fp=ffr(ae);if(fp.length>0)pool=fp;else{const nd=ae.filter(c=>!cDL.has(`${c.row},${c.col}`));if(nd.length>0)pool=nd}const ubs=Math.random()<0.667;const bsp=pool.filter(c=>c.row>=BLACK_SIDE);const rsp=pool.filter(c=>c.row<BLACK_SIDE);if(ubs&&bsp.length>0)return bsp[Math.floor(Math.random()*bsp.length)];if(rsp.length>0)return rsp[Math.floor(Math.random()*rsp.length)];if(bsp.length>0)return bsp[Math.floor(Math.random()*bsp.length)];return pool[Math.floor(Math.random()*pool.length)]}

      scored.push({c,s,cleanCap});
      if(i%4===3)await slp(0);
    }
    scored.sort((a,b)=>b.s-a.s);
    if(!scored.length)return null;
    let bestMove=scored[0].c,bestScore=scored[0].s;
    // 深度1排名第一是“干净吃子”时直接执行：白吃子是可靠收益，
    // 只有吃将或已验证的杀将路线能优先于它，不让位置分/采样噪声覆盖
    if(scored[0].cleanCap&&scored[0].c.cap){
      loadCoreState(root);
      return scored[0].c;
    }
    // 深度1第一不是干净吃子时，才让将杀搜索器介入（只找两步内确定必胜），
    // 保证“白吃子”不会被推测性赢法抢走
    loadCoreState(root);  // 深度1扫描会残留状态，先恢复
    const kill=await findGeneralKill(allowAbilities,t0,Math.min(budget,1500));
    if(kill){lastKillUsed=true;return kill}
    lastKillUsed=false;
    // 深度2/3：只精修深度1前5名（按深度1排名，不是quickScore），双采样取平均；
    // 深层分数严格更好才替换，避免采样噪声把明显差的走法抬上去
    const top=scored.slice(0,5);
    for(let depth=2;depth<=3;depth++){
      for(let i=0;i<top.length;i++){
        if(Date.now()-t0>budget)break;
        const item=top[i];
        loadCoreState(root);
        const capType=B[item.c.tr][item.c.tc];
        const r=applyRedMove(item.c);
        let s;
        if(r==='win')s=1e9;
        else if(r==='loss'){
          s=-1e9+Math.min(lossSteps*25+(item.c.cap&&capType?captureReward(item.c,capType):0),400);
        }else{
          const d1s=evalRed();
          const mid=saveCoreState();
          const s1=searchState(mid,allowAbilities,depth-1,depth===2?8:5,t0,budget);
          loadCoreState(root);
          const r2=applyRedMove(item.c);
          let s2=s1;
          if(r2==='win')s2=1e9;
          else if(r2==='ok'){
            const mid2=saveCoreState();
            s2=searchState(mid2,allowAbilities,depth-1,depth===2?8:5,t0,budget);
          }
          // 双采样取平均，且深度1分兜底
          s=Math.max(d1s,(s1+s2)/2);
          if(s<-1e9+500)s=-1e9+500;
        }
        if(LAST_RED&&item.c.tr===LAST_RED.fr&&item.c.tc===LAST_RED.fc)s-=150;
        if(item.cleanCap&&r!=='loss')s+=captureReward(item.c,capType);
        // 精修必须明显更好（高出400分）或找到必胜才允许覆盖深度1结论，
        // 避免位置分/采样噪声把“白吃子”这种可靠收益压下去
        const needMargin=s>=1e9?0:400;
        if(s>bestScore+needMargin){bestScore=s;bestMove=item.c}
        if(bestScore>=1e9)break;
      }
      if(bestScore>=1e9)break;
    }
    loadCoreState(root);
    return bestMove;
  }
  const btnAiFull=document.getElementById('btnAiFull');
  async function aiMove(){
    if(GO||!PT||!RP||solving||VA)return;
    solving=true;PT=false;
    const ver=SOLVE_VER;
    const flLabel=btnAiFull.textContent;
    btnAiFull.textContent='⏳ 计算中…';
    btnAiFull.disabled=true;br.disabled=true;
    btnAiFull.classList.add('busy');
    const move=await computeBestMove(true);
    RNG=Math.random;  // 恢复真实游戏的真随机
    solving=false;PT=true;
    btnAiFull.textContent=flLabel;
    btnAiFull.disabled=false;br.disabled=false;
    btnAiFull.classList.remove('busy');
    if(ver!==SOLVE_VER)return;
    if(!move||GO||!PT||!RP)return;
    if(move.ability&&RS[move.ability]<=0)return;
    // 记录回合档案：点击前布局 + 求解器选择 + 黑方应手
    REC_LOG={pre:statePayload(),move:{fr:move.fr,fc:move.fc,tr:move.tr,tc:move.tc,ability:move.ability||null,cap:!!move.cap},blackMoves:[]};
    AA=move.ability||null;
    HC=[{row:move.tr,col:move.tc,isCapture:!!B[move.tr][move.tc]}];
    ui();
    REC_ACTIVE=true;
    try{await ex(move.tr,move.tc)}finally{REC_ACTIVE=false}
  }
  btnAiFull.onclick=()=>aiMove();
  const btnCopyState=document.getElementById('btnCopyState');
  function flashCopyMsg(msg){
    const old=btnCopyState.textContent;
    btnCopyState.textContent=msg;
    setTimeout(()=>{btnCopyState.textContent=old},1200);
  }
  function fallbackCopy(text){
    try{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.style.position='fixed';ta.style.opacity='0';
      (document.body||document.documentElement).appendChild(ta);
      ta.select();
      const ok=document.execCommand?document.execCommand('copy'):false;
      (document.body||document.documentElement).removeChild(ta);
      flashCopyMsg(ok?'✓ 已复制':'✗ 复制失败');
    }catch(e){flashCopyMsg('✗ 复制失败')}
  }
  function statePayload(){
    const data={v:2,lv:LV,rook:RP?{r:RP.row,c:RP.col}:null,rs:{...RS},ate:ATE,swc:SWC,sc:SC,lastRed:LAST_RED,stones:[],blacks:[]};
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(B[r][c]===T.S)data.stones.push([r,c]);
      else if(B[r][c]&&B[r][c]!==T.R){
        const bp=BP.find(b=>b.row===r&&b.col===c);
        data.blacks.push({t:B[r][c],r,c,id:bp?bp.id:-1,o:bp?bp.order:-1,m:bp?bp.hasMoved:false});
      }
    }
    return data;
  }
  function copyState(){
    const text=REC_LOG
      ? 'GUOCHIYI_TURN '+JSON.stringify({pre:REC_LOG.pre,move:REC_LOG.move,black:REC_LOG.blackMoves,post:statePayload()})
      : 'GUOCHIYI_STATE '+JSON.stringify(statePayload());
    if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>flashCopyMsg('✓ 已复制'),()=>fallbackCopy(text));
    }else fallbackCopy(text);
  }
  btnCopyState.onclick=copyState;
  // 悔棋：利用完整局面快照，每回合开始压栈，悔棋时弹栈恢复
  const btnUndo=document.getElementById('btnUndo');
  function snapshotFull(){
    return {core:saveCoreState(),LV,SWC,SC,LAST_RED,VA,RECALLING,AA,HC:HC.slice(),BO:[...BO]};
  }
  function restoreFull(s){
    loadCoreState(s.core);
    LV=s.LV;SWC=s.SWC;SC=s.SC;LAST_RED=s.LAST_RED;VA=s.VA;RECALLING=s.RECALLING;AA=s.AA;HC=s.HC.slice();BO=[...s.BO];
    if(dTO){clearTimeout(dTO);dTO=null}
    vo.style.display=VA?'flex':'none';
    df.style.display='none';
    br.classList.remove('glowing');
    btnRecall.classList.remove('recalling');
    REC_LOG=null;
    ui();
  }
  function pushUndo(){
    const snap=snapshotFull();
    const last=UNDO_STACK[UNDO_STACK.length-1];
    if(last&&JSON.stringify(last.core)===JSON.stringify(snap.core))return;
    UNDO_STACK.push(snap);
    if(UNDO_STACK.length>60)UNDO_STACK.shift();
  }
  function doUndo(){
    if(solving||REC_ACTIVE)return;
    if(UNDO_STACK.length<2)return;
    UNDO_STACK.pop();
    restoreFull(UNDO_STACK[UNDO_STACK.length-1]);
  }
  btnUndo.onclick=doUndo;
  function slp(ms){return new Promise(r=>setTimeout(r,ms))}
  function anim(fr,fc,tr,tc){return new Promise(resolve=>{const piece=pl.querySelector(`.piece[data-row="${fr}"][data-col="${fc}"]`);if(!piece){resolve();return}const to=cp(tr,tc);piece.style.transition='left 0.12s ease-in-out, top 0.12s ease-in-out';piece.style.left=to.x+'px';piece.style.top=to.y+'px';piece.dataset.row=tr;piece.dataset.col=tc;const oe=()=>{piece.style.transition='';resolve()};piece.addEventListener('transitionend',oe,{once:true});setTimeout(()=>{if(piece.parentNode)oe()},150)})}
  function restart(){cdto();vo.style.display='none';df.style.display='none';VA=false;RECALLING=false;btnRecall.classList.remove('recalling');br.classList.remove('glowing');cpl();ctx.clearRect(0,0,540,600);LV=1;SWC=0;sb(false);GO=false;PT=true;sh();ui();st()}
  function activateRecall(){if(GO||!PT||!RP||RECALLING)return;RECALLING=true;AA=null;HC=[];PT=false;udc();ui();processBlackAfterRecall()}
  async function processBlackAfterRecall(){await pb2();if(!GO){udc();st()}}
  btnRecall.onclick=activateRecall;
  document.getElementById('btnHorse').onclick=()=>act('horse');document.getElementById('btnCannon').onclick=()=>act('cannon');document.getElementById('btnElephant').onclick=()=>act('elephant');document.getElementById('btnAdvisor').onclick=()=>act('advisor');br.onclick=restart;
  function act(t){if(GO||!PT||!RP||RS[t]<=0)return;if(RECALLING)return;if(AA===t){AA=null;HC=[];ui();return}AA=t;HC=am(RP.row,RP.col,t).map(m=>({row:m.row,col:m.col,isCapture:m.cap}));ui()}
  document.addEventListener('keydown',e=>{if(GO||solving)return;const k=e.key.toLowerCase();if(k==='a'){e.preventDefault();act('horse')}if(k==='s'){e.preventDefault();act('cannon')}if(k==='d'){e.preventDefault();act('elephant')}if(k==='f'){e.preventDefault();act('advisor')}if(k==='r'){e.preventDefault();activateRecall()}if(k==='z'){e.preventDefault();if(RECALLING) return;AA=null;HC=[];ui()}});
  lh();sb(false);st();
})();
</script>
